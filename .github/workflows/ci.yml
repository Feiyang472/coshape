name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # stable + beta for coverage; 1.81 pins the declared MSRV.
        rust: [stable, beta, "1.81"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Doctests
        run: cargo test --doc

  lint:
    name: fmt + clippy + docs (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: rustdoc
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The bindings are their own cargo workspace, so the jobs above do not reach
  # them. Fast feedback only: one wheel, installed and tested with uv. The full
  # platform matrix runs in release.yml.
  bindings:
    name: python bindings (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # setup-uv stopped publishing floating major tags after v7: pin the release.
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: python
      # A layout change that breaks a search in .bumpversion.toml fails here, on
      # the pull request, rather than on main at release time.
      - name: Release version bump still applies
        run: uvx bump-my-version@1.5.1 bump patch --dry-run
      - name: rustfmt
        run: cargo fmt --all --check
        working-directory: python
      # pyo3's build script refuses an interpreter older than the abi3 floor
      # (3.11), so pin one rather than rely on the runner image's python3.
      - name: Python 3.11
        run: uv venv --python 3.11
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: python
        env:
          PYO3_PYTHON: ${{ github.workspace }}/.venv/bin/python
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          # Same maturin as release.yml, so a new release cannot break the
          # release build without first breaking a pull request.
          maturin-version: v1.15.0
          command: build
          args: --out dist --manifest-path python/Cargo.toml
          manylinux: auto
      - name: Test the built wheel
        run: |
          uv pip install --no-index --find-links dist coshape
          uv pip install pytest
          uv run --no-project pytest python/tests -q
      - name: Stubs match the compiled module
        run: |
          uv pip install mypy
          uv run --no-project python -m mypy.stubtest coshape
      # The release publishes an sdist too; build and test it here as well.
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          command: sdist
          args: --out sdist --manifest-path python/Cargo.toml
      - name: Build from source and test
        run: |
          uv pip install --reinstall --no-binary coshape sdist/*.tar.gz
          uv run --no-project pytest python/tests -q
