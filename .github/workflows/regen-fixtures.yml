name: regen-fixtures

# Holds the committed TSPACK fixtures to the Fortran oracle: downloads TSPACK
# from netlib, compiles it, regenerates the fixtures and compares them with the
# committed ones, allowing only floating-point noise. It runs when something that
# feeds the fixtures changes, or on demand. The Rust port itself is held to the
# committed fixtures by tests/tspack_crossvalidation.rs in the ordinary CI.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/tspack/**
      - tests/data/**
      - .github/workflows/regen-fixtures.yml
  pull_request:
    paths:
      - tools/tspack/**
      - tests/data/**
      - .github/workflows/regen-fixtures.yml

jobs:
  regen:
    name: regenerate + compare TSPACK fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Regenerate and compare with the committed fixtures
        run: uv run --no-project --with numpy python tools/tspack/gen_reference.py --check
