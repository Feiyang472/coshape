[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "coshape"
description = "Shape-preserving 1-D spline interpolation: concavity- and monotonicity-preserving C2 splines"
# Not README.md: maturin flattens the core crate to the sdist root, where the
# repository README already lives, and two files cannot land on the same path.
readme = "README-pypi.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Feiyang Chen", email = "feiyangc@outlook.com" }]
keywords = ["interpolation", "spline", "shape-preserving", "concave", "numerics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
# Taken from Cargo.toml so the crate and the wheel cannot disagree.
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/Feiyang472/coshape"
Issues = "https://github.com/Feiyang472/coshape/issues"

[tool.maturin]
module-name = "coshape._coshape"
python-source = "pysrc"
features = ["pyo3/extension-module"]
